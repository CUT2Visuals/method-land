        "We look at how space is perceived, used and experienced — through movement, sequence, scale, material, sound and time.",
        "Rather than treating these effects as intuition alone, METHOD breaks them down into specific spatial decisions that can be tested, described and reproduced."
      ],

      about: [
        "METHOD is a landscape architecture practice started by Anton, Roma and Natasha."
      ],

      contactIntro: "For projects and collaborations",
      contactsComingSoon: "Contacts coming soon"
    },

    ru: {
      logoText: "МЕТОД",
      pageTitle: "МЕТОД — ландшафтная архитектура",

      langButtonAria: "English version",
      langButtonAriaLang: "en",

      navLabel: "Разделы",
      navProjects: "Проекты",
      navMethod: "Метод",
      navAbout: "О бюро",
      navContact: "Контакты",

      projectsTitle: "ПРОЕКТЫ",
      methodTitle: "МЕТОД",
      aboutTitle: "О БЮРО",
      contactTitle: "КОНТАКТЫ",

      heroSub: "ЛАНДШАФТНАЯ АРХИТЕКТУРА",

      method: [
        "МЕТОД — это способ превращать наблюдение в проектное решение.",
        "Мы смотрим, как пространство воспринимается, используется и переживается — через движение, последовательность, масштаб, материал, звук и время.",
        "Мы не оставляем эти эффекты на уровне интуиции: МЕТОД раскладывает их на конкретные пространственные решения, которые можно проверить, описать и повторить."
      ],

      about: [
        "МЕТОД — бюро ландшафтной архитектуры, которое начали Антон, Рома и Наташа."
      ],

      contactIntro: "Для проектов и сотрудничества",
      contactsComingSoon: "Контакты скоро"
    }

  };


  /* ==================================================
     LANGUAGE: which one opens, and how texts are found
  ================================================== */

  function storedLang() {
    try {
      const value = window.localStorage.getItem(LANG_SETTINGS.storageKey);
      return value === "en" || value === "ru" ? value : null;
    }
    catch (error) {
      return null;
    }
  }

  function storeLang(lang) {
    try {
      window.localStorage.setItem(LANG_SETTINGS.storageKey, lang);
    }
    catch (error) {
      /* the browser does not allow storage: the language
         still changes, it is only not remembered */
    }
  }

  function startLang() {

    try {
      const fromAddress = new URLSearchParams(window.location.search).get("lang");
      if (fromAddress === "en" || fromAddress === "ru") {
        return fromAddress;
      }
    }
    catch (error) {
      /* no address parameters here */
    }

    const saved = storedLang();

    if (saved) {
      return saved;
    }

    if (LANG_SETTINGS.autoDetect &&
        /^ru\b/i.test(navigator.language || "")) {
      return "ru";
    }

    return LANG_SETTINGS.defaultLang;

  }

  let currentLang = startLang();

  function t(key) {
    const table = I18N[currentLang];
    return table && key in table ? table[key] : I18N.en[key];
  }


  /* ==================================================
     PROJECTS: the gallery from PROJECTS_SETTINGS
  ================================================== */

  let discovered = null;
  let galleryStop = null;

  const SYMBOLS = ["o", "6", "4", "%", "5", "7", "_"];

  /* the size of a picture (to choose its shape), asked once */
  const pictureSizes = {};

  function pictureSize(item) {

    if (!item.src) {
      return Promise.resolve({ w: 3, h: 2 });
    }

    const url = PROJECTS_SETTINGS.folder + item.src;

    if (!pictureSizes[url]) {
      pictureSizes[url] = new Promise(
        (resolve) => {
          const image = new Image();
          image.onload = () => resolve({ w: image.naturalWidth, h: image.naturalHeight });
          image.onerror = () => resolve({ w: 3, h: 2 });
          image.src = url;
        }
      );
    }

    return pictureSizes[url];

  }

  function buildGallery() {

    if (galleryStop) {
      galleryStop();
      galleryStop = null;
    }

    const S = PROJECTS_SETTINGS;
    const gallery = document.getElementById("gallery");

    gallery.replaceChildren();

    const names = S.images.length ? S.images : (discovered || []);

    const items = names.length
      ? names.map((entry) => (typeof entry === "string" ? { src: entry } : entry))
      : Array.from({ length: S.placeholders }, () => ({ src: "" }));

    const touchOnly = window.matchMedia && window.matchMedia("(hover: none)").matches;
    const still = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

    const field = document.createElement("div");
    field.className = "field";
    field.tabIndex = 0;
    field.setAttribute("role", "group");
    field.setAttribute("aria-label", "Projects. Arrow keys move, Enter opens a picture, Escape closes it.");

    const canvas = document.createElement("canvas");
    canvas.setAttribute("aria-hidden", "true");

    const frame = document.createElement("button");
    frame.type = "button";
    frame.className = "field-open";
    frame.hidden = true;
    frame.setAttribute("aria-label", "Close the picture");

    field.appendChild(canvas);
    field.appendChild(frame);
    gallery.appendChild(field);

    const g = canvas.getContext("2d");

    /* ---------- the grid ---------- */

    const m = { w: 0, h: 0, cols: 0, rows: 0, cell: 0, dpr: 1, phone: false };

    let weight = new Float32Array(0);
    let kind = new Uint8Array(0);
    let change = new Float32Array(0);

    function layout() {

      m.phone = window.innerWidth <= 700;
      m.dpr = Math.min(2, window.devicePixelRatio || 1);
      m.w = field.clientWidth;
      m.cols = m.phone ? S.columns.phone : S.columns.desktop;
      m.cell = m.w / m.cols;

      /* the size of a symbol: the same as the symbols of the
         picture on the first screen */
      m.sym = m.phone
        ? Math.max(8.5, Math.min(window.innerWidth, 1200) * 0.0095)
        : Math.max(6.5, Math.min(window.innerWidth, 1200) * 0.00891);

      const need = (m.phone ? S.open.phone : S.open.desktop).long + 1;

      m.rows = Math.max(need, Math.round(window.innerHeight * S.height / m.cell));
      m.h = m.rows * m.cell;

      field.style.height = m.h + "px";

      canvas.width = Math.round(m.w * m.dpr);
      canvas.height = Math.round(m.h * m.dpr);
      g.setTransform(m.dpr, 0, 0, m.dpr, 0, 0);

      const count = m.cols * m.rows;

      weight = new Float32Array(count);
      kind = new Uint8Array(count);
      change = new Float32Array(count);

    }

    const px = (i) => (i + 0.5) * m.cell;
    const py = (j) => (j + 0.5) * m.cell;

    /* ---------- what moves the symbols ---------- */

    let cursor = null;          /* {x, y} in pixels, or null */
    let lastMove = -1e9;        /* when the pointer or the keys last moved */
    let keyboard = null;        /* {i, j}: the point of the keys */
    const pulses = [];          /* ripples: {x, y, t0} */

    let hole = null;            /* the open picture's rect, pixels */

    const clamp01 = (k) => Math.max(0, Math.min(1, k));

    function frameAt(now) {

      g.clearRect(0, 0, m.w, m.h);

      g.textAlign = "center";
      g.textBaseline = "middle";

      const cell = m.cell;
      const sigma = S.wave / 2.2;

      const point = keyboard
        ? { x: px(keyboard.i), y: py(keyboard.j) }
        : cursor;

      /* ripples fade after 1.6 seconds */
      for (let k = pulses.length - 1; k >= 0; k--) {
        if (now - pulses[k].t0 > 1600) {
          pulses.splice(k, 1);
        }
      }

      /* the symbols change only while something moves: the
         pointer, a ripple, or (on a phone) the slow breath */
      /* on a phone everything moves three times slower */
      const slow = m.phone ? 3 : 1;
      const breath = still ? 0 : (touchOnly ? 0.3 : 0);
      const moving = now - lastMove < 120 || pulses.length > 0 || breath > 0;

      /* the pointer rests on the field: everything stands still
         (the trail stays as it is until the pointer leaves) */
      const frozen = !moving && !!point;

      const font = m.sym + 'px "IBM Plex Mono", "Courier New", monospace';
      /* a resting point is a small cross, its height 0.32 of a symbol */
      const arm = m.sym * 0.16;

      g.lineWidth = Math.max(0.7, m.sym * 0.07);
      g.lineCap = "butt";

      for (let j = 0; j < m.rows; j++) {
        for (let i = 0; i < m.cols; i++) {

          const n = j * m.cols + i;
          const x = px(i);
          const y = py(j);

          /* under the open picture: nothing to draw (the symbols on
             its edge are drawn over it) */
          const inside = hole && x > hole.l + 1 && x < hole.r - 1 && y > hole.t + 1 && y < hole.b - 1;

          if (inside) {
            weight[n] = 0;
            kind[n] = 255;
            continue;
          }

          const onEdge = hole && x >= hole.l - 1 && x <= hole.r + 1 && y >= hole.t - 1 && y <= hole.b + 1;

          let target = 0;

          if (point) {
            const d = Math.hypot(x - point.x, y - point.y) / cell;
            target = Math.exp(-(d * d) / (2 * sigma * sigma));
          }

          for (let k = 0; k < pulses.length; k++) {
            const age = (now - pulses[k].t0) / 1000;
            const d = Math.hypot(x - pulses[k].x, y - pulses[k].y) / cell;
            const ring = Math.exp(-Math.pow(d - age * 14, 2) / 6.4) * (1 - age / 1.6);
            target = Math.max(target, ring);
          }

          if (breath) {
            const wave = Math.sin(i * 0.27 + j * 0.2 + now * 0.0012 / slow) *
                         Math.sin(i * 0.12 - j * 0.15 + now * 0.0007 / slow);
            target = Math.max(target, breath * clamp01(wave * 1.4));
          }

          /* quick to wake, slow to fall asleep: a trail behind
             the pointer */
          if (!frozen) {
            const rate = still ? 1 : (target > weight[n] ? 0.4 : 0.07) / slow;
            weight[n] += (target - weight[n]) * rate;
          }

          const w = weight[n];

          /* a halo so a symbol on the edge reads over the picture */
          if (onEdge) {
            g.fillStyle = "#f3f0e8";
            g.beginPath();
            g.arc(x, y, m.sym * 0.55, 0, 6.2832);
            g.fill();
          }

          g.fillStyle = "#000";

          if (w < 0.1) {

            kind[n] = 255;

            g.strokeStyle = "#000";
            g.beginPath();
            g.moveTo(x - arm, y);
            g.lineTo(x + arm, y);
            g.moveTo(x, y - arm);
            g.lineTo(x, y + arm);
            g.stroke();

            continue;

          }

          /* a symbol wakes with a random face; it changes only while
             something moves, and stands still when everything stops */
          if (kind[n] === 255) {
            kind[n] = Math.floor(Math.random() * SYMBOLS.length);
            change[n] = now + (210 + Math.random() * 480) * slow;
          }
          else if (moving && !still && now >= change[n]) {
            kind[n] = Math.floor(Math.random() * SYMBOLS.length);
            change[n] = now + (210 + Math.random() * 480) * slow;
          }

          const symbol = SYMBOLS[kind[n]];

          if (symbol === "o") {
            g.beginPath();
            g.arc(x, y, m.sym * 0.3, 0, 6.2832);
            g.fill();
          }
          else {
            g.font = font;
            g.fillText(symbol, x, y);
          }

        }
      }

    }

    /* the loop runs only while the field is on the screen */
    let raf = 0;
    let visible = true;
    let last = 0;

    function loop(now) {

      raf = 0;

      if (!visible) {
        return;
      }

      /* about 40 frames a second is enough for dots */
      if (now - last > 24) {
        last = now;
        frameAt(now);
      }

      raf = requestAnimationFrame(loop);

    }

    function wake() {
      if (!raf && visible) {
        raf = requestAnimationFrame(loop);
      }
    }

    let watcher = null;

    if ("IntersectionObserver" in window) {

      watcher = new IntersectionObserver(
        (entries) => {
          visible = entries[0].isIntersecting;
          if (visible) {
            wake();
            warm();
          }
        },
        { rootMargin: "200px 0px" }
      );

      watcher.observe(field);

    }

    /* ---------- opening a picture ---------- */

    let shown = -1;      /* which picture is open (-1 = none) */
    let turn = 0;        /* which picture comes next */
    let ticket = 0;      /* an answer that came too late is ignored */

    function close() {

      ticket++;
      shown = -1;
      hole = null;

      frame.hidden = true;
      frame.replaceChildren();

    }

    function open(pi, pj) {

      const index = turn % items.length;
      const item = items[index];
      const mine = ++ticket;

      turn++;

      pictureSize(item).then(
        (size) => {

          if (mine !== ticket) {
            return;
          }

          const look = m.phone ? S.open.phone : S.open.desktop;
          const ratio = size.w / size.h;

          let nx = look.short;
          let ny = look.short;

          if (ratio > 1.15) {
            nx = look.long;
          }
          else if (ratio < 0.87) {
            ny = look.long;
          }

          /* the picture runs from symbol to symbol: its edges lie on
             rows and columns of the grid, its centre is the point;
             it is pushed back inside the field by whole steps */
          let i0 = pi - nx / 2;
          let j0 = pj - ny / 2;

          i0 = Math.max(0, Math.min(m.cols - 1 - nx, i0));
          j0 = Math.max(0, Math.min(m.rows - 1 - ny, j0));

          const l = px(i0);
          const t = py(j0);
          const w = nx * m.cell;
          const h = ny * m.cell;

          hole = { l: l, t: t, r: l + w, b: t + h };

          frame.replaceChildren();
          frame.className = "field-open";

          if (item.src) {

            const image = document.createElement("img");
            image.src = S.folder + item.src;
            image.alt = item.alt || "";
            image.decoding = "async";

            frame.appendChild(image);

          }
          else {
            frame.classList.add("is-empty");
            frame.textContent = String(index + 1).padStart(2, "0");
          }

          frame.style.left = l + "px";
          frame.style.top = t + "px";
          frame.style.width = w + "px";
          frame.style.height = h + "px";
          frame.hidden = false;

          shown = index;

          /* the next ones are fetched in advance */
          pictureSize(items[(index + 1) % items.length]);
          pictureSize(items[(index + 2) % items.length]);

          wake();

        }
      );

    }

    /* the first pictures are asked for when the field comes near */
    function warm() {
      pictureSize(items[0]);
      pictureSize(items[1 % items.length]);
    }

    /* ---------- the pointer, the finger and the keys ---------- */

    function local(event) {
      const box = field.getBoundingClientRect();
      return { x: event.clientX - box.left, y: event.clientY - box.top };
    }

    function onMove(event) {

      if (event.pointerType === "touch") {
        return;
      }

      cursor = local(event);
      keyboard = null;
      lastMove = performance.now();
      wake();

    }

    function onLeave() {
      cursor = null;
    }

    function onClick(event) {

      /* the open picture handles its own click */
      if (frame.contains(event.target) && !frame.hidden) {
        return;
      }

      const at = local(event);

      const pi = Math.max(0, Math.min(m.cols - 1, Math.round(at.x / m.cell - 0.5)));
      const pj = Math.max(0, Math.min(m.rows - 1, Math.round(at.y / m.cell - 0.5)));

      open(pi, pj);
      wake();

    }

    function onKey(event) {

      const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };

      if (event.key === "Escape") {
        close();
        return;
      }

      if (arrows[event.key]) {

        event.preventDefault();

        if (!keyboard) {
          keyboard = { i: Math.floor(m.cols / 2), j: Math.floor(m.rows / 2) };
        }
        else {
          keyboard.i = Math.max(0, Math.min(m.cols - 1, keyboard.i + arrows[event.key][0]));
          keyboard.j = Math.max(0, Math.min(m.rows - 1, keyboard.j + arrows[event.key][1]));
        }

        lastMove = performance.now();
        wake();
        return;

      }

      if ((event.key === "Enter" || event.key === " ") && keyboard) {

        event.preventDefault();

        open(keyboard.i, keyboard.j);
        wake();

        frame.focus();

      }

    }

    frame.addEventListener(
      "click",
      () => {
        close();
        field.focus({ preventScroll: true });
      }
    );

    field.addEventListener("pointermove", onMove);
    field.addEventListener("pointerleave", onLeave);
    field.addEventListener("click", onClick);
    field.addEventListener("keydown", onKey);
    frame.addEventListener("keydown", (event) => { if (event.key === "Escape") { close(); field.focus({ preventScroll: true }); } });

    let resizeTimer = 0;
    let lastWidth = field.clientWidth;

    function onResize() {

      clearTimeout(resizeTimer);

      resizeTimer = setTimeout(
        () => {

          /* a phone's address bar changes the height a little:
             that is not a new size */
          if (field.clientWidth === lastWidth) {
            return;
          }

          lastWidth = field.clientWidth;

          close();
          layout();
          wake();

        },
        150
      );

    }

    window.addEventListener("resize", onResize);

    layout();
    warm();
    wake();

    galleryStop = () => {

      cancelAnimationFrame(raf);
      raf = 0;
      visible = false;

      clearTimeout(resizeTimer);
      window.removeEventListener("resize", onResize);

      if (watcher) {
        watcher.disconnect();
      }

    };

  }

  buildGallery();

  /* no list: look for 01.jpg, 02.jpg … in the folder (all the
     requests go out at once; a missing file is a quick 404) */
  if (!PROJECTS_SETTINGS.images.length && window.fetch &&
      /^https?:/.test(window.location.protocol)) {

    const names = Array.from(
      { length: PROJECTS_SETTINGS.autoMax },
      (_, i) => String(i + 1).padStart(2, "0") + ".jpg"
    );

    Promise.all(
      names.map(
        (name) => fetch(PROJECTS_SETTINGS.folder + name, { method: "HEAD" })
          .then((response) => response.ok)
          .catch(() => false)
      )
    ).then(
      (found) => {

        const list = [];

        /* the numbers must follow each other: 01, 02, 03 … */
        for (let i = 0; i < names.length && found[i]; i++) {
          list.push(names[i]);
        }

        if (list.length) {
          discovered = list;
          buildGallery();
        }

      }
    );

  }


  /* ==================================================
     METHOD and ABOUT: paragraphs from I18N
     ABOUT: the people under the text
  ================================================== */

  function fillParagraphs(containerId, key) {

    const container = document.getElementById(containerId);

    container.replaceChildren();

    t(key).forEach(
      (text, index) => {

        const element = document.createElement("p");

        if (index === 0) {
          element.className = "text-lead";
        }

        element.textContent = text;
        container.appendChild(element);

      }
    );

  }

  function buildPeople() {

    const list = document.getElementById("people");

    list.replaceChildren();

    PEOPLE.forEach(
      (person) => {

        const item = document.createElement("li");
        item.className = "person section-small";

        const name = document.createElement("span");
        name.textContent = person.name[currentLang] || person.name.en;

        const role = document.createElement("span");
        role.textContent = person.role[currentLang] || person.role.en;

        item.appendChild(name);
        item.appendChild(role);
        list.appendChild(item);

      }
    );

  }

  function buildTexts() {
    fillParagraphs("methodBody", "method");
    fillParagraphs("aboutBody", "about");
    buildPeople();
  }

  buildTexts();


  /* ==================================================
     CONTACT: rows from CONTACT_SETTINGS
  ================================================== */

  function buildContact() {

    const body = document.getElementById("contactBody");

    body.replaceChildren();

    document.getElementById("contactIntro").textContent =
      t("contactIntro");

    const rows =
      CONTACT_SETTINGS.filter((row) => row.value && row.value.trim());

    if (!rows.length) {

      const empty = document.createElement("p");
      empty.className = "contact-empty section-small";
      empty.textContent = t("contactsComingSoon");

      body.appendChild(empty);
      return;

    }

    const list = document.createElement("ul");
    list.className = "contact-list";

    rows.forEach(
      (row) => {

        const item = document.createElement("li");
        item.className = "contact-row section-small";

        if (row.label) {
          const label = document.createElement("span");
          label.textContent = row.label;
          item.appendChild(label);
        }

        let href = (row.href || "").trim();

        if (!href && /^[^\s@]+@[^\s@]+$/.test(row.value.trim())) {
          href = "mailto:" + row.value.trim();
        }

        let value;

        if (href) {

          value = document.createElement("a");
          value.className = "text-link";
          value.href = href;

          if (!href.startsWith("mailto:")) {
            value.target = "_blank";
            value.rel = "noopener";
          }

        }
        else {
          value = document.createElement("span");
        }

        value.classList.add("contact-value");
        value.textContent = row.value;

        item.appendChild(value);
        list.appendChild(item);

      }
    );

    body.appendChild(list);

  }

  buildContact();


  /* ==================================================
     SETTINGS: LETTERS APPEARING
     (safe to tweak)
  ================================================== */

  /*
    Every text of the page (the menu, the titles, the paragraphs)
    appears the same way as METHOD on the first screen: letter by
    letter, at once, as if a mask were taken off each letter. No
    fade, no movement. Every letter gets its own random moment.

    A letter's moment = its place in the text * step (but no more
    than cap) + a random part up to jitter. All in milliseconds.

    short   titles and the menu (less than longLength letters)
    long    paragraphs: a text is open to the end in about
            cap + jitter milliseconds, however long it is
  */

  const MASK_SETTINGS = {
    longLength: 40,
    short: { step: 40, cap: 240, jitter: 520 },
    long:  { step: 4,  cap: 700, jitter: 420 }
  };

  const REDUCE_MOTION =
    !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);


  /* ==================================================
     LETTERS APPEARING: cutting texts into letters and
     taking the mask off
  ================================================== */

  /*
    Cuts the text of the element into words (never broken in the
    middle) and letters (hidden until the element gets the class
    "on"). Links and other markup inside stay as they are.
  */
  function splitMask(element) {

    const nodes = [];
    const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);

    while (walker.nextNode()) {
      nodes.push(walker.currentNode);
    }

    const total = nodes.reduce(
      (sum, node) => sum + Array.from(node.nodeValue.replace(/\s/g, "")).length,
      0
    );

    const look = total < MASK_SETTINGS.longLength ? MASK_SETTINGS.short : MASK_SETTINGS.long;

    let index = 0;

    nodes.forEach(
      (node) => {

        const parts = node.nodeValue.split(/(\s+)/);
        const fragment = document.createDocumentFragment();

        parts.forEach(
          (part) => {

            if (part === "") {
              return;
            }

            if (/^\s+$/.test(part)) {
              fragment.appendChild(document.createTextNode(part));
              return;
            }

            const word = document.createElement("span");
            word.className = "wd";

            Array.from(part).forEach(
              (character) => {

                const letter = document.createElement("span");

                const delay =
                  Math.min(index * look.step, look.cap) + Math.random() * look.jitter;

                letter.className = "ch";
                letter.style.setProperty("--d", Math.round(delay) + "ms");
                letter.textContent = character;

                word.appendChild(letter);

                index++;

              }
            );

            fragment.appendChild(word);

          }
        );

        node.parentNode.replaceChild(fragment, node);

      }
    );

  }

  /* the mask comes off: the letters switch on, one by one */
  function revealMask(element) {

    element.dataset.revealed = "1";
    element.classList.add("on");

  }

  let maskWatcher = null;

  if (!REDUCE_MOTION && "IntersectionObserver" in window) {

    maskWatcher = new IntersectionObserver(
      (entries) => {
        entries.forEach(
          (entry) => {
            if (entry.isIntersecting) {
              revealMask(entry.target);
              maskWatcher.unobserve(entry.target);
            }
          }
        );
      },
      { rootMargin: "0px 0px -12% 0px" }
    );

  }

  /*
    Cuts every marked text (data-mask) into letters. Called again
    whenever texts are rebuilt (language change): a text that was
    already shown comes back letter by letter, one that was not
    yet reached keeps waiting for its turn.
  */
  function prepareMasks() {

    if (REDUCE_MOTION) {
      return;
    }

    document.querySelectorAll("[data-mask]").forEach(
      (element) => {

        splitMask(element);

        if (element.dataset.revealed === "1") {
          return;
        }

        if (element.closest("header")) {

          /* the header does not wait for a scroll */
          requestAnimationFrame(() => revealMask(element));
          return;

        }

        if (maskWatcher) {
          maskWatcher.observe(element);
        }
        else {
          revealMask(element);
        }

      }
    );

  }

  prepareMasks();

  /* the title is ready: the page may show it */
  document.documentElement.classList.add("ready");


  /* ==================================================
     LANGUAGE BUTTON
  ================================================== */

  const langButton = document.getElementById("langButton");
  const langText = document.getElementById("langText");

  function setupLangButton() {

    langText.textContent = LANG_SETTINGS.labels[currentLang];

    /* what a screen reader says: the language it switches to,
       in that language */
    langButton.setAttribute("aria-label", t("langButtonAria"));
    langButton.setAttribute("lang", t("langButtonAriaLang"));

  }

  /* puts the whole page into "lang" at once; the scroll
     position stays */
  function applyLanguage(lang) {

    currentLang = lang;

    document.documentElement.lang = lang;
    document.title = t("pageTitle");

    document.querySelectorAll("[data-i18n]").forEach(
      (element) => {
        element.textContent = t(element.dataset.i18n);
      }
    );

    document.querySelectorAll("[data-i18n-aria]").forEach(
      (element) => {
        element.setAttribute("aria-label", t(element.dataset.i18nAria));
      }
    );

    document.querySelectorAll(".site-nav a").forEach(
      (link) => { link.setAttribute("lang", lang); }
    );

    setupLangButton();
    buildTexts();
    buildContact();

    /* the new texts are cut into letters again */
    prepareMasks();

    /* the band of the header and the line under METHOD are
       drawn with symbols: they need the new words */
    document.dispatchEvent(new Event("methodlanguage"));

  }

  /* the button: the other language, remembered, and the
     address updated (?lang=…) without reloading */
  function switchLanguage() {

    const next = currentLang === "en" ? "ru" : "en";

    applyLanguage(next);
    storeLang(next);

    try {
      const address = new URL(window.location.href);
      address.searchParams.set("lang", next);
      window.history.replaceState(window.history.state, "", address.toString());
    }
    catch (error) {
      /* the address can not be changed here: the language
         still works */
    }

  }

  langButton.addEventListener("click", switchLanguage);


  /* ==================================================
     HEADER LINKS: jump to a section (or to the top)
     (the same as on cut2.tools)
  ================================================== */

  const NAV_SECTIONS = ["projects", "method", "about", "contact"];

  /* where the page has to stop: the top of the section right
     under the header, measured now (not remembered); never
     further than the page can scroll */
  function navTargetY(id) {

    if (!id) {
      return 0;
    }

    const section = document.getElementById(id);
    const headerBottom = document.querySelector("header").getBoundingClientRect().bottom;
    const maxY = document.documentElement.scrollHeight - window.innerHeight;
    const y = section.getBoundingClientRect().top + window.scrollY - headerBottom;

    return Math.max(0, Math.min(Math.round(y), Math.floor(maxY)));

  }

  let navAnimation = null;

  function stopNavAnimation() {
    if (navAnimation) {
      cancelAnimationFrame(navAnimation.frame);
      navAnimation = null;
    }
  }

  /* a visitor who scrolls takes over at once */
  ["wheel", "touchstart"].forEach(
    (type) => window.addEventListener(type, stopNavAnimation, { passive: true })
  );

  window.addEventListener(
    "keydown",
    (event) => {
      if (["ArrowUp", "ArrowDown", "PageUp", "PageDown", "Home", "End", " "].includes(event.key)) {
        stopNavAnimation();
      }
    }
  );

  function scrollPageTo(y, done) {

    stopNavAnimation();

    const reduce =
      window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (!(NAV_SETTINGS.scrollMs > 0) || reduce) {
      window.scrollTo(0, y);
      done();
      return;
    }

    const from = window.scrollY;
    const start = performance.now();
    const length = NAV_SETTINGS.scrollMs;

    const step = (now) => {
      const k = Math.min(1, (now - start) / length);
      const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      window.scrollTo(0, Math.round(from + (y - from) * e));
      if (k < 1) {
        navAnimation.frame = requestAnimationFrame(step);
      }
      else {
        navAnimation = null;
        done();
      }
    };

    navAnimation = { frame: requestAnimationFrame(step) };

  }

  /*
    Goes to a section (or to the top when id is empty), puts the
    keyboard on the section title and writes #section into the
    address (or removes it) without a new history entry; ?lang
    and the rest of the address stay.
  */
  function navigateTo(id, options) {

    const opts = options || {};

    scrollPageTo(
      navTargetY(id),
      () => {

        if (id && opts.focus !== false) {
          const title = document.getElementById(id).querySelector(".section-title");
          if (title) {
            title.focus({ preventScroll: true });
          }
        }

        if (opts.address !== false) {
          try {
            const address = new URL(window.location.href);
            address.hash = id ? "#" + id : "";
            window.history.replaceState(window.history.state, "", address.toString());
          }
          catch (error) {
            /* the address can not be changed here: the jump still works */
          }
        }

      }
    );

  }

  /* clicks: a normal click jumps; a click with Ctrl / Cmd /
     Shift or the middle button does what the browser does */
  const navClick = (id) => (event) => {

    if (event.defaultPrevented || event.button !== 0 ||
        event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
      return;
    }

    event.preventDefault();
    navigateTo(id);

  };

  document.getElementById("homeLink").addEventListener("click", navClick(""));

  document.querySelectorAll(".site-nav a").forEach(
    (link) => link.addEventListener("click", navClick(link.dataset.nav))
  );

  /*
    Opened with #projects, #method, #about or #contact in the
    address: once the fonts are loaded and the pictures have
    their places, the page is put exactly on the section, once.
    A normal reload or back / forward keeps the place the
    browser restores.
  */
  (() => {

    const id = window.location.hash.slice(1);

    if (!NAV_SECTIONS.includes(id)) {
      return;
    }

    let kind = "navigate";

    try {
      const entry = performance.getEntriesByType("navigation")[0];
      kind = entry ? entry.type : "navigate";
    }
    catch (error) {
      kind = "navigate";
    }

    if (kind === "reload" || kind === "back_forward") {
      return;
    }

    const fontsReady =
      document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();

    fontsReady.then(
      () => requestAnimationFrame(
        () => requestAnimationFrame(
          () => navigateTo(id, { address: false })
        )
      )
    );

  })();


  /* the page opens in the detected language */
  if (currentLang !== "en") {
    applyLanguage(currentLang);
  }
  else {
    setupLangButton();
  }


  /* ==================================================
     SETTINGS: THE PICTURE OF SYMBOLS (header and first screen)
     (safe to tweak)
  ================================================== */

  /*
    Everything on the first screen is made of the same symbols
    and sits in the same grid of cells: the band of the header
    (rows of dots with the names of the sections in the middle
    row), the picture below it (a block of terrain seen at an
    angle: the surface, and the two front faces cut vertically,
    drawn with lines), and two rows of the picture that are
    really text: METHOD and the line under it.

    When the page opens, the picture stands still and covers the
    two text rows. Scrolling spreads it: the two halves slide out
    to the left and to the right edge of the screen (every symbol
    has its own random delay and speed). METHOD and the line stay
    where they are and show through as the symbols leave: METHOD
    first, the line under it second. Scrolling back puts the
    picture together again. The page scrolls through a track 240vh
    tall (see .hero-track in the styles); the screen stays in
    place meanwhile.

    split          the picture is gone at this share of the scroll
                   through the track (0 = the top, 1 = the end)
    seed           which terrain it is (any number gives another)
    cellDivisor    how many symbols fit across the terrain
                   (bigger = finer symbols)
    minCell        the smallest width of one symbol, pixels
    tilt           how steep the view of the terrain is: 0.5 =
                   like a map seen at an angle, bigger = steeper
    height         how tall the mountains are, as a share of the
                   width of the terrain
    wall           how tall the cut faces under the terrain are,
                   as a share of its width
    width          how much of the screen width the terrain takes
    topBias        where the picture sits in the free space: 0 = right
                   under the header, 0.5 = in the middle, 1 = at the bottom
    bottomGap      free room under the picture, as a share of the
                   screen height

    Diagnostics in the address: ?introP=0.5 shows the picture at
    that scroll share and stops; ?introSeed=5 tries another
    terrain.
  */

  const INTRO_SETTINGS = {
    split: 0.8,

    seed: 3,
    cellDivisor: 165,

    desktop: { minCell: 4,   bottomGap: 0.1,  topBias: 0.35,  tilt: 0.6,  height: 0.2,  wall: 0.08, width: 0.9 },
    phone:   { minCell: 5.2, bottomGap: 0.12, topBias: 0.2, tilt: 0.75, height: 0.26, wall: 0.1,  width: 0.8 }
  };


  /* ==================================================
     THE PICTURE: the first screen, drawn on a canvas
     with symbols
  ================================================== */

  (() => {

    const root = document.documentElement;
    const header = document.querySelector("header");
    const track = document.getElementById("heroTrack");
    const stage = document.getElementById("heroStage");
    const canvas = document.getElementById("introCanvas");

    const ctx = canvas ? canvas.getContext("2d") : null;

    /* no canvas: the page stays plain (black header, the words
       of the first screen are shown as text) */
    if (!ctx) {

      if (canvas) {
        canvas.remove();
      }

      stage.querySelectorAll(".visually-hidden").forEach(
        (element) => element.classList.remove("visually-hidden")
      );

      return;

    }

    const params = new URLSearchParams(window.location.search);
    const forcedProgress = params.get("introP");

    const INK = "#000";
    const PAPER = "#f3f0e8";

    /* the fonts: the Latin and the Cyrillic file */
    const FONT_FAMILY = '"IBM Plex Mono", "Courier New", monospace';


    /* ---------- the terrain (a height for every point) ---------- */

    /* a small random-number generator: the same seed gives the
       same picture every time */
    function mulberry(seed) {
      let a = seed >>> 0;
      return () => {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const seedFromAddress = Number(params.get("introSeed"));
    const random = mulberry(seedFromAddress || INTRO_SETTINGS.seed);

    /* smooth noise from a table of random values */
    const LATTICE = 64;
    const lattice = new Float32Array(LATTICE * LATTICE);

    for (let i = 0; i < lattice.length; i++) {
      lattice[i] = random();
    }

    function noise(x, y) {

      const xi = Math.floor(x);
      const yi = Math.floor(y);
      const xf = x - xi;
      const yf = y - yi;

      const u = xf * xf * (3 - 2 * xf);
      const v = yf * yf * (3 - 2 * yf);

      const at = (a, b) => lattice[((b & (LATTICE - 1)) * LATTICE) + (a & (LATTICE - 1))];

      const top = at(xi, yi) + (at(xi + 1, yi) - at(xi, yi)) * u;
      const bottom = at(xi, yi + 1) + (at(xi + 1, yi + 1) - at(xi, yi + 1)) * u;

      return top + (bottom - top) * v;

    }

    function fbm(x, y, octaves) {

      let amplitude = 0.5;
      let frequency = 1;
      let sum = 0;

      for (let octave = 0; octave < octaves; octave++) {
        sum += amplitude * noise(x * frequency, y * frequency);
        frequency *= 2;
        amplitude *= 0.5;
      }

      return sum;

    }

    const phoneAtStart = window.innerWidth <= 700;
    const GRID = phoneAtStart ? 230 : 320;

    const heights = new Float32Array(GRID * GRID);
    const lights = new Float32Array(GRID * GRID);
    const worldX = new Float32Array(GRID * GRID);
    const worldY = new Float32Array(GRID * GRID);

    (() => {

      const ox = random() * 20;
      const oy = random() * 20;

      let min = Infinity;
      let max = -Infinity;

      for (let iy = 0; iy < GRID; iy++) {
        for (let ix = 0; ix < GRID; ix++) {

          const u = ix / (GRID - 1);
          const v = iy / (GRID - 1);

          const base = fbm(u * 3.4 + ox, v * 3.4 + oy, 6);
          const ridge = 1 - Math.abs(2 * fbm(u * 2.6 + oy, v * 2.6 + ox, 5) - 1);

          /* one big massif off the middle, lower ground in front */
          const du = u - 0.45;
          const dv = v - 0.4;
          const massif = Math.exp(-(du * du + dv * dv) / 0.07);

          const h = 0.42 * base + 0.55 * ridge * ridge + 0.3 * massif - 0.1 * v;

          heights[iy * GRID + ix] = h;

          /* min and max of what is stored (rounded the same way) */
          min = Math.min(min, heights[iy * GRID + ix]);
          max = Math.max(max, heights[iy * GRID + ix]);

          worldX[iy * GRID + ix] = u - 0.5;
          worldY[iy * GRID + ix] = v - 0.5;

        }
      }

      for (let i = 0; i < heights.length; i++) {
        heights[i] = Math.pow(Math.max(0, (heights[i] - min) / (max - min)), 1.25);
      }

      /* light from the upper left: how bright every point is */
      const lx = -0.62;
      const ly = -0.5;
      const lz = 0.6;
      const slopeScale = 0.35 * GRID / 2;

      let lo = Infinity;
      let hi = -Infinity;

      for (let iy = 0; iy < GRID; iy++) {
        for (let ix = 0; ix < GRID; ix++) {

          const x0 = Math.max(0, ix - 1);
          const x1 = Math.min(GRID - 1, ix + 1);
          const y0 = Math.max(0, iy - 1);
          const y1 = Math.min(GRID - 1, iy + 1);

          const dx = (heights[iy * GRID + x1] - heights[iy * GRID + x0]) * slopeScale;
          const dy = (heights[y1 * GRID + ix] - heights[y0 * GRID + ix]) * slopeScale;

          const nl = Math.hypot(dx, dy, 1);
          const light = (-dx * lx - dy * ly + lz) / nl;

          lights[iy * GRID + ix] = light;

          lo = Math.min(lo, lights[iy * GRID + ix]);
          hi = Math.max(hi, lights[iy * GRID + ix]);

        }
      }

      for (let i = 0; i < lights.length; i++) {
        lights[i] = (lights[i] - lo) / (hi - lo);
      }

    })();


    /* ---------- the grid of cells ---------- */

    const dpr = Math.min(2, window.devicePixelRatio || 1);

    /* sizes of the grid: set by layout() */
    const m = {
      width: 0, height: 0,
      cw: 0, ch: 0, font: 0,
      cols: 0, rows: 0,
      headerRows: 0, headerH: 0,
      phone: false
    };

    let look = INTRO_SETTINGS.desktop;

    let baseSymbols = [];     /* the terrain */
    let symbols = [];         /* the terrain and the cells that hide text */
    let texts = [];           /* the letters of METHOD and of the line */
    let slotOf = null;        /* which symbol is in which cell */
    const flagged = [];

    function cellHash(col, row) {

      let n = (col * 374761393 + row * 668265263) | 0;
      n = (n ^ (n >>> 13)) * 1274126177;
      n = n ^ (n >>> 16);

      return ((n >>> 0) % 10000) / 10000;

    }

    function makeSymbol(col, row, kind) {
      return {
        x: col * m.cw + m.cw / 2,
        y: row * m.ch + m.ch / 2,
        kind: kind,
        r1: cellHash(row + 7, col + 3),
        r2: cellHash(col + 11, row + 5),
        r3: cellHash(row + 19, col + 23)
      };
    }


    /* ---------- the sprites: every symbol drawn once ---------- */

    const KINDS = ["o", "6", "4", "%", "5", "7", "_"];
    let atlas = {};

    function buildAtlas() {

      atlas = {};

      const sw = Math.ceil(m.cw * dpr) + 1;
      const sh = Math.ceil(m.ch * dpr) + 1;

      KINDS.forEach(
        (kind) => {

          const sprite = document.createElement("canvas");
          sprite.width = sw;
          sprite.height = sh;

          const g = sprite.getContext("2d");

          g.fillStyle = INK;

          if (kind === "o") {
            g.beginPath();
            g.ellipse(sw / 2, sh / 2, m.cw * dpr * 0.5, m.ch * dpr * 0.48, 0, 0, Math.PI * 2);
            g.fill();
          }
          else if (kind === "_") {
            const thick = Math.max(1, Math.round(m.font * dpr * 0.07));
            g.fillRect(0, Math.round(sh * 0.78), sw, thick);
          }
          else {
            g.font = (m.font * dpr) + "px " + FONT_FAMILY;
            g.textAlign = "center";
            g.textBaseline = "middle";
            g.fillText(kind, sw / 2, sh / 2);
          }

          atlas[kind] = { image: sprite, w: sw / dpr, h: sh / dpr };

        }
      );

    }

    /* puts a symbol with its middle at (x, y), on a whole pixel */
    function stamp(g, kind, x, y) {

      const sprite = atlas[kind];

      g.drawImage(
        sprite.image,
        Math.round((x - m.cw / 2) * dpr) / dpr,
        Math.round((y - m.ch / 2) * dpr) / dpr,
        sprite.w,
        sprite.h
      );

    }


    /* ---------- the terrain block, cell by cell ---------- */

    function buildTerrain() {

      const list = [];

      /* the picture does not stick to the lower edge of the screen:
         there is free room under it (INTRO_SETTINGS.bottomGap) */
      const zoneTop = m.headerH + 10;
      const zoneBottom = m.height - Math.max(18, m.height * look.bottomGap);
      const zone = zoneBottom - zoneTop;


      const reliefW = Math.min(
        m.width * look.width,
        1100,
        zone / (look.tilt + look.height + look.wall)
      );

      const k = reliefW / Math.SQRT2;
      const amp = reliefW * look.height;
      const wallPx = reliefW * look.wall;

      /* the whole block (peaks and cut faces) in the middle of
         the space under the header */
      const extent = reliefW * look.tilt + amp + wallPx;
      const top = zoneTop + (zone - extent) * look.topBias;

      /* the two lines of text sit at the middle of the picture */
      m.zoneMiddle = top + extent / 2;

      const cx = m.width / 2;
      const cy = top + amp + reliefW * look.tilt / 2;

      const cells = m.cols * m.rows;
      const depthBuffer = new Float32Array(cells).fill(-1e9);
      const codeBuffer = new Int32Array(cells).fill(-1);   /* -2 = cut face */

      const cos45 = Math.SQRT1_2;

      function plot(sx, sy, depth, code) {

        const col = Math.floor(sx / m.cw);
        const row = Math.floor(sy / m.ch);

        if (col < 0 || col >= m.cols || row < m.headerRows || row >= m.rows) {
          return;
        }

        const slot = row * m.cols + col;

        if (depth > depthBuffer[slot]) {
          depthBuffer[slot] = depth;
          codeBuffer[slot] = code;
        }

      }

      /* the surface */
      for (let i = 0; i < GRID * GRID; i++) {

        const x = worldX[i];
        const y = worldY[i];

        const xr = (x - y) * cos45;
        const yr = (x + y) * cos45;

        plot(
          cx + xr * k,
          cy + yr * k * look.tilt - heights[i] * amp,
          yr,
          i
        );

      }

      /*
        The two front faces: along the two front edges of the
        block the ground is cut straight down. Each face is
        filled from the line of the ground to the bottom, which
        gives the vertical cuts of the picture.
      */
      const stepY = m.ch * 0.5;

      for (let edge = 0; edge < 2; edge++) {
        for (let i = 0; i < GRID; i++) {

          const index = edge === 0 ? i * GRID + (GRID - 1) : (GRID - 1) * GRID + i;

          const x = worldX[index];
          const y = worldY[index];

          const xr = (x - y) * cos45;
          const yr = (x + y) * cos45;

          const sx = cx + xr * k;
          const baseY = cy + yr * k * look.tilt;

          for (let sy = baseY - heights[index] * amp; sy <= baseY + wallPx; sy += stepY) {
            plot(sx, sy, yr + 0.002, -2);
          }

        }
      }

      slotOf = new Int32Array(cells).fill(-1);

      for (let slot = 0; slot < cells; slot++) {

        const code = codeBuffer[slot];

        if (code === -1) {
          continue;
        }

        const col = slot % m.cols;
        const row = (slot - col) / m.cols;

        let kind;

        if (code === -2) {
          kind = "_";
        }
        else {

          const h = heights[code];
          const light = lights[code];
          const luck = cellHash(col, row);

          /*
            Which symbol: low ground is a line (_); higher ground
            gets heavier the brighter it is: a dot for the heaviest,
            then 6, 4, %. Neighbours get the same symbol, so the
            symbols form patches, as in the original.
          */
          if (h < 0.2 - 0.05 * light) {
            kind = "_";
          }
          else {

            const weight = 0.62 * light + 0.55 * h + (luck - 0.5) * 0.07;

            if (weight > 0.72) {
              kind = "o";
            }
            else if (weight > 0.6) {
              kind = "6";
            }
            else if (weight > 0.5) {
              kind = "4";
            }
            else if (weight > 0.43) {
              kind = luck > 0.55 ? "%" : "";
            }
            else {
              kind = luck > 0.88 ? "_" : "";
            }

          }

        }

        if (kind) {
          slotOf[slot] = list.length;
          list.push(makeSymbol(col, row, kind));
        }

      }

      return list;

    }


    /* ---------- the two rows of text inside the picture ---------- */

    /*
      METHOD and the line under it are real letters in two rows of
      the grid. Under every letter lies one symbol of the picture
      (if the terrain has none there, a filler is added). The
      letter shows through as that symbol leaves, so the text
      appears exactly where the picture clears.
    */
    const TEXT_START_1 = 0.55;     /* when METHOD begins to show (a share of the spread) */
    const TEXT_START_2 = 0.85;     /* and the line under it */
    const TEXT_STAGGER_1 = 0.03;   /* delay between two letters */
    const TEXT_STAGGER_2 = 0.014;
    const SPREAD_END = 1.7;        /* where the spread ends, in the same units */

    function rebuildText() {

      flagged.forEach((symbol) => { delete symbol.fixed; });
      flagged.length = 0;

      const covers = [];

      texts = [];

      const lines = [t("logoText"), t("heroSub")];
      const middle = Math.round(m.zoneMiddle / m.ch - 0.5);
      const rowOf = [middle - 1, middle + 1];

      lines.forEach(
        (line, lineIndex) => {

          const chars = Array.from(line);
          const start = Math.round((m.cols - chars.length) / 2);
          const row = rowOf[lineIndex];

          chars.forEach(
            (character, i) => {

              if (character === " ") {
                return;
              }

              const col = start + i;
              const slot = row * m.cols + col;

              let symbol = slotOf[slot] >= 0 ? baseSymbols[slotOf[slot]] : null;

              if (!symbol) {

                /* a filler that looks like the terrain around it */
                const luck = cellHash(col + 5, row + 9);

                symbol = makeSymbol(col, row, luck > 0.75 ? "o" : (luck > 0.35 ? "6" : "4"));
                covers.push(symbol);

              }

              symbol.fixed = lineIndex === 0
                ? TEXT_START_1 + i * TEXT_STAGGER_1
                : TEXT_START_2 + i * TEXT_STAGGER_2;

              flagged.push(symbol);

              texts.push({
                character: character,
                x: col * m.cw + m.cw / 2,
                y: row * m.ch + m.ch / 2,
                cover: symbol,
                /* the letter shows (at once, no fade) when its cover
                   has gone this far: a different point for every
                   letter, so the order is a little random */
                at: 0.1 + cellHash(col + 31, row + 17) * 0.6
              });

            }
          );

        }
      );

      symbols = baseSymbols.concat(covers);

    }


    /* ---------- layout: everything depends on the screen size ---------- */

    function setupCanvas(element, context, width, height) {

      element.width = Math.round(width * dpr);
      element.height = Math.round(height * dpr);

      context.setTransform(dpr, 0, 0, dpr, 0, 0);

    }

    function layout() {

      m.phone = window.innerWidth <= 700;
      look = m.phone ? INTRO_SETTINGS.phone : INTRO_SETTINGS.desktop;

      m.width = stage.clientWidth;
      m.height = stage.clientHeight;

      m.cw = Math.max(
        look.minCell,
        Math.min(m.width, 1200) * look.width / INTRO_SETTINGS.cellDivisor
      );
      m.ch = m.cw * 1.28;
      m.font = m.cw / 0.6 * 0.98;

      m.cols = Math.ceil(m.width / m.cw);
      m.rows = Math.ceil(m.height / m.ch);

      /* the header is a plain bar: the picture starts under it */
      m.headerH = header.offsetHeight;
      m.headerRows = Math.ceil(m.headerH / m.ch);

      setupCanvas(canvas, ctx, m.width, m.height);

      buildAtlas();

      baseSymbols = buildTerrain();
      rebuildText();

    }


    /* ---------- drawing and the scroll ---------- */

    const ease = (k) => k * k * (3 - 2 * k);
    const clamp01 = (k) => Math.max(0, Math.min(1, k));

    /* how far a symbol has gone (0 = at home, 1 = gone) at time t of the spread */
    function progressOf(symbol, time) {

      let delay;
      let duration;

      if (symbol.fixed !== undefined) {
        delay = symbol.fixed;
        duration = 0.4;
      }
      else {

        /* a random delay and speed for every symbol */
        const half = m.width / 2;
        const away = Math.min(1, Math.abs(symbol.x - half) / half);

        delay = (1 - away) * 0.3 + symbol.r1 * 0.2;
        duration = 0.35 + symbol.r2 * 0.3;

      }

      return clamp01((time - delay) / duration);

    }

    /* draws the picture for the scroll share p (0 = whole) */
    function draw(p) {

      ctx.clearRect(0, 0, m.width, m.height);

      const time = clamp01(p / INTRO_SETTINGS.split) * SPREAD_END;
      const half = m.width / 2;

      for (let i = 0; i < symbols.length; i++) {

        const symbol = symbols[i];

        let x = symbol.x;
        let y = symbol.y;

        if (time > 0) {

          const k = progressOf(symbol, time);

          if (k > 0) {

            const side = symbol.x < half ? -1 : 1;
            const travel = half - Math.abs(symbol.x - half) + m.cw * 3 + symbol.r3 * 60;

            x += side * travel * k * k * k;
            y += (symbol.r3 - 0.5) * 24 * k;

            if (x < -m.cw || x > m.width + m.cw) {
              continue;
            }

          }

        }

        stamp(ctx, symbol.kind, x, y);

      }

      /* the two rows of text show through as their symbols leave */
      ctx.fillStyle = INK;
      ctx.font = m.font + "px " + FONT_FAMILY;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      for (let i = 0; i < texts.length; i++) {

        const letter = texts[i];

        if (progressOf(letter.cover, time) > letter.at) {
          ctx.fillText(letter.character, letter.x, letter.y);
        }

      }

    }

    /* the scroll share: 0 at the top of the page, 1 where the
       track ends */
    function scrollShare() {

      const range = track.offsetHeight - stage.offsetHeight;

      if (range <= 0) {
        return 1;
      }

      return clamp01(-track.getBoundingClientRect().top / range);

    }

    let lastShare = -1;

    function update() {

      const share = scrollShare();

      if (share === lastShare) {
        return;
      }

      lastShare = share;

      draw(share);

    }

    let ticking = false;

    function onScroll() {

      if (!ticking) {

        ticking = true;

        requestAnimationFrame(() => {
          ticking = false;
          update();
        });

      }

    }

    let resizeTimer = 0;
    let lastWidth = 0;
    let lastHeight = 0;

    function onResize() {

      clearTimeout(resizeTimer);

      resizeTimer = setTimeout(
        () => {

          /* a phone's address bar changes the height a little:
             that is not a new size */
          if (stage.clientWidth === lastWidth &&
              Math.abs(stage.clientHeight - lastHeight) < 120) {
            return;
          }

          lastWidth = stage.clientWidth;
          lastHeight = stage.clientHeight;

          layout();
          lastShare = -1;
          update();

        },
        150
      );

    }

    let ready = false;

    /* the language changed: new words in the header and in the
       line under METHOD */
    document.addEventListener(
      "methodlanguage",
      () => {

        if (!ready) {
          return;
        }

        rebuildText();

        lastShare = -1;
        update();

      }
    );

    /* starts once the fonts are ready (Latin and Cyrillic), so the
       symbols do not change shape in the middle */
    const fontReady =
      document.fonts && document.fonts.load
        ? Promise.all([
            document.fonts.load('16px "IBM Plex Mono"', "METHOD 4567%"),
            document.fonts.load('16px "IBM Plex Mono"', "ПРОЕКТЫ МЕТОД ЛАНДШАФТ")
          ])
        : Promise.resolve();

    Promise.race([
      fontReady,
      new Promise((resolve) => setTimeout(resolve, 1200))
    ]).then(() => {

      lastWidth = stage.clientWidth;
      lastHeight = stage.clientHeight;

      layout();

      ready = true;

      if (forcedProgress !== null) {
        draw(Number(forcedProgress));
        return;
      }

      /* opened already scrolled (a reload, #about): the picture
         shows the state for this place */
      update();

      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", onResize);

    });

  })();

  window.__methodReady = true;

</script>


</body>
</html>
