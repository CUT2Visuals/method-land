<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
    Page title, description and the picture for link previews.
    These values repeat I18N.en (pageTitle) in the script below.
    They are written here in plain HTML on purpose: search
    engines and social networks do not run scripts. If you
    change one, change the other.
  -->
  <title>METHOD — landscape architecture</title>
  <meta name="description" content="METHOD is a landscape architecture practice. It turns observation into spatial decisions that can be tested, described and reproduced.">
  <link rel="canonical" href="https://method.land/">

  <meta property="og:title" content="METHOD — landscape architecture">
  <meta property="og:description" content="METHOD is a landscape architecture practice. It turns observation into spatial decisions that can be tested, described and reproduced.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://method.land/">
  <meta property="og:image" content="https://method.land/og-image.png">
  <meta property="og:image:alt" content="METHOD — landscape architecture">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f3f0e8">

  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">

  <!-- the font is part of the site (fonts/), no Google Fonts -->
  <link
    rel="preload"
    href="fonts/ibm-plex-mono-latin-400.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  >

  <style>

    /* ==================================================
       FONT: IBM Plex Mono Regular 2.3 (SIL Open Font
       License, see fonts/OFL.txt). The same files as on
       cut2.tools. The browser loads a file only when the
       text needs its characters (unicode-range).
    ================================================== */

    @font-face {
      font-family: "IBM Plex Mono";
      font-style: normal;
      font-weight: 400;
      font-display: swap;

      src: url("fonts/ibm-plex-mono-latin-400.woff2") format("woff2");

      unicode-range:
        U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
        U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F,
        U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
        U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: "IBM Plex Mono";
      font-style: normal;
      font-weight: 400;
      font-display: swap;

      src: url("fonts/ibm-plex-mono-cyrillic-400.woff2") format("woff2");

      unicode-range:
        U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }

    @font-face {
      font-family: "IBM Plex Mono";
      font-style: normal;
      font-weight: 400;
      font-display: swap;

      src: url("fonts/ibm-plex-mono-arrows-400.woff2") format("woff2");

      unicode-range: U+2190, U+2192;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      background: #f3f0e8;
      color: #000;

      font-family:
        "IBM Plex Mono",
        "Courier New",
        monospace;
    }

    body {
      overflow-x: hidden;
    }


    /* ==================================================
       HEADER: a plain black bar
    ================================================== */

    :root {
      --paper: #f3f0e8;

      --header-h: 48px;

      /* one size for the small display lines: the section titles
         (as big as the symbols of the picture on the first screen) */
      --display: var(--sym);

      /* the size of one symbol of the picture on the first screen
         (see INTRO_SETTINGS: width of a cell / 0.6 * 0.98): the
         names of the sections are as big as METHOD there */
      --sym: max(6.5px, calc(min(100vw, 1200px) * 0.00891));
    }

    header {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: var(--header-h);

      padding: 0 20px;

      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;

      background: #000;
      color: var(--paper);

      font-size: var(--sym);
      letter-spacing: 0;

      z-index: 100;
    }

    header a,
    .lang-button {
      color: var(--paper);
      text-decoration: none;

      font-family: inherit;
      font-size: inherit;
      font-weight: 400;
      letter-spacing: inherit;
      line-height: normal;
      text-transform: uppercase;
      white-space: nowrap;

      transition: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* at least 44px high for fingers */
    header a,
    .lang-button {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
    }

    .logo {
      justify-self: start;
    }

    .lang-button {
      justify-self: end;

      border: 0;
      border-radius: 0;
      background: none;
      padding: 0;

      cursor: pointer;
    }

    .site-nav {
      display: flex;
      gap: 40px;
    }

    header a:focus,
    .lang-button:focus {
      outline: none;
    }

    header a:focus-visible,
    .lang-button:focus-visible {
      outline: 1px solid var(--paper);
      outline-offset: 4px;
    }


    /* ==================================================
       HERO: the picture of symbols on the first screen
    ================================================== */

    /*
      The first screen is a picture made of symbols (a piece of
      terrain seen at an angle, cut like a block), drawn on a
      canvas. The screen stays in place (sticky) while the page
      scrolls through the track. The scroll spreads the picture
      to the left and to the right edge; METHOD and the line
      under it are two rows of the same grid: they stay where
      they are and show through as the symbols leave.
    */
    .hero-track {
      position: relative;
      height: 240vh;
    }

    .hero-stage {
      position: sticky;
      top: 0;

      height: 100vh;
      height: 100svh;

      overflow: hidden;
    }

    .intro-canvas {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;
    }

    /* the title and the line are drawn on the canvas; these two
       are the same words for screen readers and search engines */
    .visually-hidden {
      position: absolute;

      width: 1px;
      height: 1px;

      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /*
      Texts that appear letter by letter, at once (as if a mask
      were taken off): the script cuts a text into letters,
      every letter is its own box, hidden until its turn. The
      container gets the class "on" and each letter switches on
      after its own random delay (--d); no fade, a hard cut.
    */
    .ch {
      opacity: 0;
    }

    .on .ch {
      animation: unmask 1ms steps(1, end) both;
      animation-delay: var(--d, 0ms);
    }

    @keyframes unmask {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* a word never breaks in the middle */
    .wd {
      display: inline-block;
      white-space: nowrap;
    }

    @media (prefers-reduced-motion: reduce) {
      .ch { opacity: 1; }
      .on .ch { animation: none; }
    }

    /* the sides must not scroll while letters wait outside */
    main {
      overflow-x: clip;
    }


    /* ==================================================
       SECTIONS (normal scrolling, as after the scene on
       cut2.tools)
    ================================================== */

    .page-section {
      padding: 64px 28px;

      /* a jump from the header stops with the section right
         under the header */
      scroll-margin-top: var(--header-h);
    }

    .section-title:focus {
      outline: none;
    }

    .section-title {
      margin: 0 0 28px;

      text-align: center;

      font-size: var(--display);
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: 0;

      text-transform: uppercase;
    }

    /* small texts of the sections: ordinary letters, not capitals */
    .section-small {
      font-size: 11px;
      font-weight: 400;

      text-transform: none;
      letter-spacing: 0;
    }

    /* underline also under the words cut into letters */
    .text-link .wd {
      text-decoration: inherit;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .text-link {
      color: inherit;

      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .page-section a:focus,
    .page-section button:focus {
      outline: none;
    }

    .page-section a:focus-visible,
    .page-section button:focus-visible {
      outline: 1px solid #000;
      outline-offset: 3px;
    }

    .page-section a,
    .page-section button {
      scroll-margin-top: calc(var(--header-h) + 24px);
    }


    /* ==================================================
       PROJECTS: a field of symbols
    ================================================== */

    /*
      A field of symbols on a grid, drawn on a canvas. The symbols
      are small dots; near the pointer they grow and change into
      the symbols of the picture on the first screen. A click opens
      a picture right there (it covers a block of cells); a click on
      the picture closes it. No animation. Built from
      PROJECTS_SETTINGS.
    */
    #projects {
      padding-left: 0;
      padding-right: 0;
    }

    #projects .section-title {
      padding: 0 28px;
    }

    .field {
      position: relative;

      width: 100%;

      /* a finger moving up and down scrolls the page */
      touch-action: pan-y;

      cursor: default;
      -webkit-tap-highlight-color: transparent;
    }

    .field:focus {
      outline: none;
    }

    .field:focus-visible {
      outline: 1px solid #000;
      outline-offset: -4px;
    }

    /* the symbols lie over the picture, so the ones on its edge
       stay visible; the clicks pass through to what is below */
    .field canvas {
      position: absolute;
      inset: 0;
      z-index: 2;

      width: 100%;
      height: 100%;

      display: block;

      pointer-events: none;
    }

    .field-open {
      position: absolute;
      z-index: 1;

      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;

      overflow: hidden;
      background: #e7e3d8;
      color: inherit;
      font: inherit;

      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .field-open[hidden] {
      display: none;
    }

    .field-open img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    /* an empty frame before the real picture arrives */
    .field-open.is-empty {
      background: var(--paper);
      box-shadow: inset 0 0 0 1px #000;

      text-align: left;
      vertical-align: top;
    }

    .field-open:focus {
      outline: none;
    }

    .field-open:focus-visible {
      outline: 2px solid #000;
      outline-offset: 3px;
    }


    /* ==================================================
       METHOD / ABOUT (text)
    ================================================== */

    .text-block {
      max-width: 640px;
      margin: 0 auto;

      text-align: center;
    }

    .text-lead {
      margin: 0 0 28px;

      font-size: clamp(14px, 1.3vw, 18px);
      line-height: 1.45;
      font-weight: 400;
    }

    .text-block p {
      margin: 0 0 20px;

      font-size: 13px;
      line-height: 1.6;
    }

    .text-block p:last-child {
      margin-bottom: 0;
    }

    /* people in ABOUT: one under another, in the middle */
    .people {
      margin: 40px 0 0;
      padding: 0;

      list-style: none;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 12px;
    }

    .person {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;

      gap: 12px;

      text-align: center;
    }


    /* ==================================================
       CONTACT (the same as on cut2.tools)
    ================================================== */

    .contact-intro {
      margin: 0 0 28px;

      text-align: center;
    }

    .contact-list {
      margin: 0;
      padding: 0;

      list-style: none;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 12px;
    }

    .contact-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;

      gap: 12px;

      text-align: center;
    }

    .contact-value {
      overflow-wrap: anywhere;
    }

    .contact-empty {
      margin: 0;

      text-align: center;
    }

    /* the last section ends with the same space as it starts */
    .contact-section {
      min-height: 60vh;
    }


    /* ==================================================
       MOBILE
    ================================================== */

    @media (max-width: 700px) {

      /* phone browsers move their address bar while the page
         scrolls; the stage keeps the largest height (100lvh) so
         the picture does not jump */
      .hero-track {
        height: 240vh;
        height: 240lvh;
      }

      .hero-stage {
        height: 100vh;
        height: 100lvh;
      }

      :root {
        --header-h: 44px;
        --sym: max(8.5px, calc(min(100vw, 1200px) * 0.0095));
      }

      header {
        padding: 0 16px;
        grid-template-columns: auto 1fr auto;
      }

      /* the sections spread evenly between the name and the language */
      .site-nav {
        justify-content: space-evenly;
        gap: 8px;
      }

      .page-section {
        padding: 52px 16px;
      }

      /* on a phone every text of the page has one size: the size
         of the titles and of the symbols of the picture */
      .section-small,
      .text-lead,
      .text-block p {
        font-size: var(--sym);
      }

      #projects .section-title {
        padding: 0 16px;
      }

      .people {
        margin-top: 32px;
      }

      .contact-intro {
        margin-bottom: 20px;
      }

    }

  </style>
</head>


<body>

<script>
  /* styles for the opening animation apply only when scripts run;
     if the main script has not finished in 3 seconds (an error),
     they are switched off so nothing stays hidden */
  document.documentElement.classList.add("js");

  setTimeout(
    function () {
      if (!window.__methodReady) {
        document.documentElement.classList.remove("js");
      }
    },
    3000
  );
</script>


<header>

  <!-- the name is not translated -->
  <a class="logo" href="#" id="homeLink"><span class="logo-text" data-mask data-i18n="logoText">METHOD</span></a>

  <nav class="site-nav" aria-label="Sections" data-i18n-aria="navLabel">

  <button
    type="button"
    class="lang-button"
    id="langButton"
  ><span class="lang-text" id="langText" data-mask>RU</span></button>

</header>


<main>

  <!-- ==================================================
       HERO
       ================================================== -->

  <section class="hero-track" id="heroTrack" aria-labelledby="heroTitle">

    <div class="hero-stage" id="heroStage">

      <canvas class="intro-canvas" id="introCanvas" aria-hidden="true"></canvas>

      <!-- the same words are drawn on the canvas with symbols -->
      <h1 class="visually-hidden" id="heroTitle" data-i18n="logoText">METHOD</h1>
      <p class="visually-hidden" data-i18n="heroSub">LANDSCAPE ARCHITECTURE</p>

    </div>

  </section>


  <!-- ==================================================
       PROJECTS (built from PROJECTS_SETTINGS)
       ================================================== -->

  <section class="page-section" id="projects" aria-labelledby="projectsTitle">

    <h2 class="section-title" data-mask id="projectsTitle" data-i18n="projectsTitle" tabindex="-1">PROJECTS</h2>

    <div class="gallery" id="gallery"></div>

  </section>


  <!-- ==================================================
       METHOD
       ================================================== -->

  <section class="page-section" id="method" aria-labelledby="methodTitle">

    <h2 class="section-title" data-mask id="methodTitle" data-i18n="methodTitle" tabindex="-1">METHOD</h2>

    <div class="text-block" id="methodBody"></div>

  </section>


  <!-- ==================================================
       ABOUT
       ================================================== -->

  <section class="page-section" id="about" aria-labelledby="aboutTitle">

    <h2 class="section-title" data-mask id="aboutTitle" data-i18n="aboutTitle" tabindex="-1">ABOUT</h2>

    <div class="text-block" id="aboutBody"></div>

    <ul class="people" id="people"></ul>

  </section>


  <!-- ==================================================
       CONTACT (built from CONTACT_SETTINGS)
       ================================================== -->

  <section class="page-section contact-section" id="contact" aria-labelledby="contactTitle">

    <h2 class="section-title" data-mask id="contactTitle" data-i18n="contactTitle" tabindex="-1">CONTACT</h2>

    <p class="contact-intro section-small" id="contactIntro"></p>

    <div id="contactBody"></div>

  </section>

</main>


<script>

  /* ==================================================
     SETTINGS: LANGUAGE BUTTON (top right of the header)
     (safe to tweak)
  ================================================== */

  /*
    One page in two languages; the button switches between them
    at once, without reloading (as on cut2.tools).

    defaultLang    language when nothing else says otherwise
    autoDetect     true = a browser set to Russian opens the
                   Russian page (only if nothing else is set)
    labels         text on the button for each current language:
                   it names the language the button switches to
    storageKey     name under which the browser remembers the
                   chosen language

    Which language opens:
      1) ?lang=ru or ?lang=en in the address (only for this
         visit, it does not change what is remembered);
      2) the language chosen earlier with the button;
      3) defaultLang.
  */

  const LANG_SETTINGS = {
    defaultLang: "en",
    autoDetect: false,
    labels: { en: "RU", ru: "EN" },
    storageKey: "method-lang"
  };


  /* ==================================================
     SETTINGS: HOW THE PAGE SCROLLS TO A SECTION
     (safe to tweak)
  ================================================== */

  /*
    scrollMs   how long a jump from the header takes,
               milliseconds (0 = at once, as on cut2.tools).
               Ignored with "reduce motion".
  */

  const NAV_SETTINGS = {
    scrollMs: 0
  };


  /* ==================================================
     SETTINGS: PROJECTS (the gallery)
     (safe to tweak)
  ================================================== */

  /*
    A field of symbols on a grid (small dots). Near the pointer the
    dots turn into symbols that change while the pointer moves and
    freeze when it stops. A click opens the next picture at that
    place: its edges run exactly along rows and columns of the
    symbols (a wide picture 12 x 8 steps of the grid, a tall one
    8 x 12, an almost square one 8 x 8). A click on the open picture
    closes it; a click elsewhere replaces it with the next picture.
    On a phone a tap does the same, and the field breathes slowly
    by itself.

    columns       how many symbols across the screen
                  (desktop / phone)
    open          how many steps of the grid the open picture
                  covers: the long side and the short side
                  (desktop / phone; bigger = bigger pictures)
    height        the height of the field as a share of the
                  height of the screen
    wave          how far the pointer's wave reaches, in cells
    placeholders  how many empty frames to use while there are
                  no pictures
    images        the pictures, in the order they come. Every one
                  is a file name inside the folder projects/
                  (next to index.html), for example "01.jpg", or
                  { src: "01.jpg", alt: "what is shown" }.
                  A picture should be a JPG about 2000 px wide.
  */

  const PROJECTS_SETTINGS = {

    columns: { desktop: 32, phone: 14 },
    open: {
      desktop: { long: 12, short: 8 },
      phone:   { long: 12, short: 8 }
    },
    height: 0.8,
    wave: 1.8,
    placeholders: 12,

    folder: "projects/",

    images: [
      /* "01.jpg", "02.jpg", … */
    ],

    /* while the list above is empty the page looks in the folder
       for 01.jpg, 02.jpg, 03.jpg … and shows all it finds, up to
       this number (no list to edit: just add the files) */
    autoMax: 120

  };


  /* ==================================================
     SETTINGS: ABOUT (the people)
     (safe to tweak)
  ================================================== */

  /*
    One line per person under the ABOUT text:
      name      the name (English and Russian)
      role      what the person does (English and Russian)
  */

  const PEOPLE = [

    { name: { en: "Anton Bratkov", ru: "Антон Братков" },  role: { en: "Landscape architect",                    ru: "Ландшафтный архитектор" } },
    { name: { en: "Roma Kaygorodov", ru: "Рома Кайгородов" },   role: { en: "Street furniture and play equipment",    ru: "Уличная мебель и игровое оборудование" } },
    { name: { en: "Natasha Matsenko", ru: "Наташа Маценко" }, role: { en: "Business development manager",                                ru: "Менеджер по развитию" } }

  ];


  /* ==================================================
     SETTINGS: CONTACT
     (safe to tweak)
  ================================================== */

  /*
    One row per contact:
      label   small text before the value (optional)
      value   what is shown (a row with an empty value is not
              shown; with no rows the section says
              contactsComingSoon)
      href    the link (optional; an e-mail address gets
              mailto: by itself)
  */

  const CONTACT_SETTINGS = [

    { label: "", value: "hello@method.land", href: "" }

  ];


  /* ==================================================
     TEXTS IN TWO LANGUAGES
     (safe to tweak)
  ================================================== */

  /*
    Every text of the page that changes with the language.
    Big words and small captions are shown in capitals by the
    CSS anyway; write the short ones in capitals here too.
    The METHOD and ABOUT texts are lists of paragraphs: the
    first one is the large line at the top.
    The name of the bureau is translated too (logoText).
  */

  const I18N = {

    en: {
      logoText: "METHOD",
      pageTitle: "METHOD — landscape architecture",

      langButtonAria: "Russian version",
      langButtonAriaLang: "ru",

      navLabel: "Sections",
      navProjects: "Projects",
      navMethod: "Method",
      navAbout: "About",
      navContact: "Contact",

      projectsTitle: "PROJECTS",
      methodTitle: "METHOD",
      aboutTitle: "ABOUT",
      contactTitle: "CONTACT",

      heroSub: "LANDSCAPE ARCHITECTURE",

      method: [
